<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dashboard โครงการเช่าเชื่อมโยงเครือข่าย กรมอนามัย</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap">
<style>
:root{color-scheme:light;--bg:#f5f6f8;--card:#fff;--tx:#1d2330;--mut:#667085;--bd:#d9dde5;--pri:#4b3fbf;--ok:#1f8a4c;--node:#eceafc;--nodebd:#4b3fbf;--center:#4b3fbf;--line:#b9b4ea;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#14161b;--card:#1e2128;--tx:#eceef3;--mut:#9aa2b1;--bd:#363b46;--pri:#8f86ff;--ok:#4cc27f;--node:#2a2750;--nodebd:#8f86ff;--center:#6b60e0;--line:#4a4682}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#14161b;--card:#1e2128;--tx:#eceef3;--mut:#9aa2b1;--bd:#363b46;--pri:#8f86ff;--ok:#4cc27f;--node:#2a2750;--nodebd:#8f86ff;--center:#6b60e0;--line:#4a4682}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg);color:var(--tx);font-family:"Sarabun","Noto Sans Thai",system-ui,sans-serif;line-height:1.5}
main{max-width:900px;margin:0 auto;padding:16px}
h1{font-size:1.25rem;margin:0 0 12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:14px}
.ph{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-weight:700}
.ph small{color:var(--mut);font-weight:400}
.bar{height:16px;background:var(--bd);border-radius:10px;overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;width:0;background:var(--ok);transition:width .5s}
.pct{font-size:1.6rem;color:var(--ok)}
.legend{display:flex;gap:16px;justify-content:center;font-size:.85rem;color:var(--mut);margin-top:4px;flex-wrap:wrap}
.legend b{display:inline-block;width:12px;height:12px;border-radius:50%;vertical-align:-1px;margin-right:4px;border:2px solid var(--nodebd)}
svg{display:block;width:100%;height:auto;max-width:760px;margin:0 auto}
.node{cursor:pointer;outline:none}
.node circle{fill:var(--node);stroke:var(--nodebd);stroke-width:3;transition:transform .15s}
.node text{fill:var(--tx);font-family:inherit;font-weight:600;text-anchor:middle;pointer-events:none}
.node:hover circle,.node:focus-visible circle{stroke-width:6}
.node.done circle{fill:var(--ok);stroke:var(--ok)}
.node.done text{fill:#fff}
.line{stroke:var(--line);stroke-width:2}
.hub circle{fill:var(--center)}
.hub text{fill:#fff;font-family:inherit;font-weight:700;text-anchor:middle}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:16px;z-index:5}
.ov[hidden]{display:none}
.pop{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:18px;width:100%;max-width:460px;max-height:90%;overflow:auto;position:relative}
.pop h2{margin:0 36px 12px 0;font-size:1.1rem;color:var(--pri)}
.x{position:absolute;top:10px;right:10px;width:32px;height:32px;border-radius:50%;border:1px solid var(--bd);background:transparent;color:var(--tx);font-size:16px;cursor:pointer}
.f{padding:8px 0;border-top:1px solid var(--bd)}
.f:first-of-type{border-top:0}
.f span{display:block;font-size:.8rem;color:var(--mut)}
.f div{word-break:break-word}
</style>
</head>
<body>
<main>
<h1>Dashboard โครงการเช่าเชื่อมโยงเครือข่ายสื่อสารความเร็วสูง กรมอนามัย</h1>

<div class="card">
  <div class="ph"><span>สถานะใบส่งมอบ</span><span class="pct" id="pct">0%</span></div>
  <div class="bar"><i id="fill"></i></div>
  <div class="ph" style="margin-top:6px"><small id="cnt"></small></div>
</div>

<div class="card">
  <svg id="map" viewBox="0 0 760 760" role="img" aria-label="แผนผังหน่วยงานที่เชื่อมกับกรมอนามัย"></svg>
  <div class="legend"><span><b style="background:var(--node)"></b>รอใบส่งมอบ</span><span><b style="background:var(--ok);border-color:var(--ok)"></b>ส่งมอบแล้ว</span><span>แตะวงกลมเพื่อดูรายละเอียด</span></div>
</div>
</main>

<div class="ov" id="ov" hidden><div class="pop" role="dialog" aria-modal="true"><button class="x" id="x" aria-label="ปิด">✕</button><h2 id="ttl"></h2><div id="body"></div></div></div>

<script>
// ข้อมูลจาก Excel: b=MPLS(B) d=FTTX(D) f=หน่วยงาน(F) g=จังหวัด(G) k=รายชื่อ NT(K) l=เบอร์โทร NT(L) n=สถานะใบส่งมอบ(N)
const ROWS=[
{b:"GDI691182",d:"5328j0510",f:"ศูนย์อนามัยที่ 1 เชียงใหม่",g:"เชียงใหม่",k:"นายจักรภพ ท้วมวงศ์",l:"090-5060632",n:""},
{b:"GDI691572",d:"5523j9433",f:"ศูนย์อนามัยที่ 2 พิษณุโลก",g:"พิษณุโลก",k:"นายภาณุภพ รัพย์สมบัติ , นายอุทิศ ม่อมละมูล",l:"081-2310813",n:""},
{b:"GDI691573",d:"5621j4708",f:"ศูนย์อนามัยที่ 3 นครสวรรค์",g:"นครสวรรค์",k:"พี่บอล กำพล",l:"091-0984849,085-5785895",n:""},
{b:"GDI691574",d:"3248j7603",f:"ศูนย์อนามัยที่ 4 สระบุรี",g:"สระบุรี",k:"นายวุทธิชัย น้อยคำปัน",l:"090-9342662",n:""},
{b:"GDI691575",d:"3232j3376",f:"ศูนย์อนามัยที่ 5 ราชบุรี",g:"ราชบุรี",k:"นายสรัญ พุ่มด้วง (OS)",l:"065-6036688",n:""},
{b:"GDI691576",d:"3828j3739",f:"ศูนย์อนามัยที่ 6 ชลบุรี",g:"ชลบุรี",k:"นายมังคลารัต",l:"098-7962261",n:""},
{b:"GDI691577",d:"4324j4108",f:"ศูนย์อนามัยที่ 7 ขอนแก่น",g:"ขอนแก่น",k:"นายสุกิต",l:"086-8992793",n:""},
{b:"GDI691578",d:"4224j6848",f:"ศูนย์อนามัยที่ 8 อุดรธานี",g:"อุดรธานี",k:"นายรุ่งโรจน์ เจริญไชย\nนายสุรสิต ปิ่นเกษร",l:"0864643526\n0823111119",n:""},
{b:"GDI691579",d:"4420j2934",f:"ศูนย์อนามัยที่ 9 นครราชสีมา",g:"นครราชสีมา",k:"นายเกรียงวุฒิ จรภักดี",l:"081-7606968",n:""},
{b:"GDI691580",d:"4532j3844",f:"ศูนย์อนามัยที่ 10 อุบลราชธานี",g:"อุบลราชธานี",k:"พี่สังเวียน",l:"086-1688912",n:""},
{b:"GDI691581",d:"7551j5620",f:"ศูนย์อนามัยที่ 11 นครศรีธรรมราช",g:"นครราชศรีธรรมราช",k:"นายพรรณิภา นิลอุบล",l:"086-4703734",n:""},
{b:"GDI691582",d:"7320j4034",f:"ศูนย์อนามัยที่ 12 ยะลา",g:"ยะลา",k:"นายธิบดี ศรีธรรมกุล",l:"081-4180031",n:""},
{b:"GDI691584",d:"5422j8633",f:"ศูนย์อนามัยกลุ่มชาติพันธุ์ ชายขอบและแรงงานข้ามชาติ",g:"ลำปาง",k:"นายทิตินันท์",l:"081-2320005",n:""},
{b:"GDI691585",d:"5328j0622",f:"ศูนย์ทันตสาธารณสุขระหว่างประเทศ",g:"เชียงใหม่",k:"นายจักรภพ ท้วมวงศ์",l:"090-5060632",n:""}
];

const NS="http://www.w3.org/2000/svg",$=id=>document.getElementById(id);
const el=(t,a,p)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);if(p)p.append(e);return e;};
const line1=s=>String(s||"").split(/\n/).map(x=>x.trim()).filter(Boolean).join(" , ");

// Progress: แถวที่คอลัมน์ N มีข้อมูล / จำนวนแถวทั้งหมด
const done=ROWS.filter(r=>String(r.n).trim()!=="").length,total=ROWS.length,pct=Math.round(done/total*100);
$("pct").textContent=pct+"%";$("fill").style.width=pct+"%";
$("cnt").textContent="ส่งมอบแล้ว "+done+" จาก "+total+" แห่ง";

// Graph
const svg=$("map"),C=380,R=285,RN=52;
const nodes=ROWS.map((r,i)=>{const a=-Math.PI/2+i*2*Math.PI/ROWS.length;return{r,x:C+R*Math.cos(a),y:C+R*Math.sin(a)};});
nodes.forEach(n=>el("line",{class:"line",x1:C,y1:C,x2:n.x,y2:n.y},svg));
const hub=el("g",{class:"hub"},svg);
el("circle",{cx:C,cy:C,r:78},hub);
const ht=el("text",{x:C,y:C+8,"font-size":22},hub);ht.textContent="กรมอนามัย";
nodes.forEach((n,i)=>{
  const g=el("g",{class:"node"+(String(n.r.n).trim()?" done":""),tabindex:0,role:"button","aria-label":n.r.g+" "+n.r.f},svg);
  el("circle",{cx:n.x,cy:n.y,r:RN},g);
  const len=n.r.g.length,fs=len>12?10.5:len>9?13:15;
  const t=el("text",{x:n.x,y:n.y+fs*0.35,"font-size":fs},g);t.textContent=n.r.g;
  g.addEventListener("click",()=>openCard(n.r));
  g.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();openCard(n.r);}});
});

// Card
function openCard(r){
  $("ttl").textContent=r.g;
  const body=$("body");body.innerHTML="";
  [["หน่วยงาน",r.f],["บริการ MPLS",r.b],["บริการ Corporate internet / FTTX",r.d],["รายชื่อ (NT)",line1(r.k)],["เบอร์โทรศัพท์ (NT)",line1(r.l)]].forEach(([h,v])=>{
    const d=document.createElement("div");d.className="f";
    const s=document.createElement("span");s.textContent=h;
    const v2=document.createElement("div");v2.textContent=v||"-";
    d.append(s,v2);body.append(d);
  });
  $("ov").hidden=false;$("x").focus();
}
const close=()=>{$("ov").hidden=true;};
$("x").onclick=close;
$("ov").addEventListener("click",e=>{if(e.target===$("ov"))close();});
document.addEventListener("keydown",e=>{if(e.key==="Escape")close();});
</script>
</body>
</html>
